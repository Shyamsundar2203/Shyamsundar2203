name: Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake (light theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shyamsundar2203
          outputs: |
            dist/github-snake.svg?color_snake=#10B981&color_dots=#2d3343,#22D3EE,#0891B2,#A78BFA,#7C3AED
          # ↑ dark snake: first dot color = #2d3343 (visible slate on GitHub dark #0d1117)

      - name: Generate contribution snake (dark theme)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shyamsundar2203
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#10B981&color_dots=#2d3343,#22D3EE,#0891B2,#A78BFA,#7C3AED

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
